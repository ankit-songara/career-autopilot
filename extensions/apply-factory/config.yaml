paths:
  # Local to apply-factory
  kb_db: "kb.sqlite"

  # Career-ops files (relative to this config, i.e. from extensions/apply-factory/)
  profile: "../../config/profile.yml"
  reports_dir: "../../reports"
  output_dir: "../../output"
  pipeline_tsv: "../../data/pipeline.tsv"

llm:
  backend: "opencode"
  model: "kimi-k2"
  temperature: 0.1

kimi_webbridge:
  # Submit policy — enforced by the AGENT following prompts/kimi_*.md, not by
  # Python code (orchestrator.py never reads these keys). The prompts stop for
  # user review before every submit unless auto_submit is true BOTH here and
  # in answer-bank.yaml (behavior.auto_submit). Flip only once you trust the
  # flow end-to-end.
  never_auto_submit: true
  auto_submit: false
  checkpoint_timeout_sec: 900
